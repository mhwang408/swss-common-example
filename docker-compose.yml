services:
  database:
    image: redis:7-alpine
    container_name: database
    command:
      - "redis-server"
      - "--port"
      - "0"
      - "--databases"
      - "32"
      - "--appendonly"
      - "no"
      - "--notify-keyspace-events"
      - "KEA"
      - "--unixsocket"
      - "/var/run/redis/redis.sock"
      - "--unixsocketperm"
      - "777"
    volumes:
      - /var/run/redis:/var/run/redis
      - ./database_config.json:/var/run/redis/sonic-db/database_config.json:ro

  runner:
    build:
      context: .
      dockerfile: ./Dockerfile
    image: swss-common-example-runner
    depends_on:
      - database
    user: "${UID}:${GID}"
    working_dir: /home/ubuntu/swss-common-example
    volumes:
      - .:/home/ubuntu/swss-common-example
      - swss-common-install:/usr/local
      - /var/run/redis:/var/run/redis

volumes:
  swss-common-install:
