services:
  database:
    image: redis:7-alpine
    container_name: database
    command:
      - "sh"
      - "-c"
      - >
        mkdir -p /var/run/redis/sonic-db &&
        cp /tmp/database_config.json /var/run/redis/sonic-db/database_config.json &&
        chmod 755 /var/run/redis/sonic-db &&
        chmod 644 /var/run/redis/sonic-db/database_config.json &&
        exec redis-server
        --port 0
        --databases 32
        --appendonly no
        --notify-keyspace-events KEA
        --unixsocket /var/run/redis/redis.sock
        --unixsocketperm 777
    volumes:
      - /var/run/redis:/var/run/redis
      - ./database_config.json:/tmp/database_config.json:ro

  runner:
    build:
      context: ../..
      dockerfile: examples/custom_tables/Dockerfile
    image: ows-example-runner
    depends_on:
      - database
    working_dir: /workspace
    volumes:
      - ../..:/workspace:ro
      - /var/run/redis:/var/run/redis
